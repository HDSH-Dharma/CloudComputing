name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    env:
      # Placeholders so `next build` can compile; real values are only on the VPS.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  edge-functions:
    name: Deno check Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --config supabase/functions/deno.json supabase/functions/*/index.ts
      # Dependabot only bumps package.json, so a security fix can miss the Deno pins.
      # Fail when a package pinned in deno.json has a different version in package.json.
      - name: Deno pins match package.json
        run: |
          fail=0
          for spec in $(grep -ho '"npm:[^"]*"' supabase/functions/deno.json supabase/functions/*/deno.json | tr -d '"' | sort -u); do
            spec=${spec#npm:}; name=${spec%@*}; ver=${spec##*@}
            for pj in package.json apps/*/package.json packages/*/package.json; do
              got=$(grep -o "\"$name\": *\"[^\"]*\"" "$pj" | sed 's/.*: *"\(.*\)"/\1/')
              if [ -n "$got" ] && [ "$got" != "$ver" ]; then
                echo "::error::$pj has $name $got but deno.json pins $ver"; fail=1
              fi
            done
          done
          exit $fail

  migrations:
    name: Validate Supabase migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      # Spins up a throwaway local Postgres and applies every migration + seed.
      - run: supabase db start
      - run: supabase db reset
      - name: Lint SQL
        run: supabase db lint --level error

  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
