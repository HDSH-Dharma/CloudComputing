name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  supabase:
    name: Supabase migrations + Edge Functions
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - run: supabase db push --remote
      - name: Sync Edge Function secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
        run: |
          # Only send secrets that are set, so a missing one never overwrites a value with "".
          args=(CORS_ORIGINS="${CORS_ORIGINS:-*}" GEMINI_MODEL="${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}")
          [ -n "$GEMINI_API_KEY" ] && args+=(GEMINI_API_KEY="$GEMINI_API_KEY")
          [ -n "$TELEGRAM_BOT_TOKEN" ] && args+=(TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN")
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" "${args[@]}"
      - run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"

  vps:
    name: Deploy Next.js to VPS (PM2)
    needs: supabase
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            # Non-interactive SSH does not read ~/.bashrc, so load nvm-managed Node explicitly.
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then . "$NVM_DIR/nvm.sh"; fi
            export PATH="$HOME/.local/bin:$HOME/.npm-global/bin:$PATH"
            # Never block on Corepack's "download pnpm? [Y/n]" prompt.
            export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
            cd "${{ secrets.VPS_APP_DIR }}"
            git fetch --prune origin main
            git reset --hard origin/main
            corepack enable --install-directory "$HOME/.local/bin"
            pnpm install --frozen-lockfile
            pnpm build
            if [ -d apps/web ]; then
              pm2 startOrReload ecosystem.config.cjs --env production
              pm2 save
            else
              echo "apps/web not created yet — skipping PM2 reload"
            fi
