# Supabase CLI config for local development (`supabase start`).
# Full reference: https://supabase.com/docs/guides/local-development/cli/config
project_id = "filamentiq"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "200MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enabled = true
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.gcode-parse]
verify_jwt = true

[functions.assistant-chat]
verify_jwt = true
